[advisories]
# Deny any crates with known security vulnerabilities
version = 2
ignore = [
    # chrono and chrono-tz are unmaintained (no fixed release; jiff or time
    # recommended). Not vulnerabilities; chrono is used across the crate and through
    # agent-sessions, so migrating is its own change. Remove once both are gone.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; migration to jiff or time tracked separately" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained; goes with the chrono migration" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
