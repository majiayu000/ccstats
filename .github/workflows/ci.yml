name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Deny
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: Test
        run: cargo test
      - name: Release metadata
        run: |
          unset GITHUB_REF_NAME
          scripts/check-release.sh
          python3 scripts/stage-desktop-artifacts.py --self-test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --tests --bins --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          fail_ci_if_error: false

  desktop:
    name: Desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Install Chromium
        working-directory: desktop
        run: npx playwright install chromium
      - name: Desktop Rust format
        run: cargo fmt --all --manifest-path desktop/src-tauri/Cargo.toml --check
      - name: Desktop Rust clippy
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Desktop Rust test
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - name: Frontend build
        working-directory: desktop
        run: npm run build
      - name: Frontend end-to-end tests
        working-directory: desktop
        run: npm run test:e2e
      - name: Native Tauri end-to-end test
        working-directory: desktop
        run: npm run test:e2e:native

  windows-credentials:
    name: Windows credentials
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test private credential storage
        run: cargo test --locked --lib credentials::tests
