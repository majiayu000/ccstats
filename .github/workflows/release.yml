name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Validate release metadata
        run: scripts/check-release.sh

      - name: Stage-artifact helper self-test
        run: python3 scripts/stage-desktop-artifacts.py --self-test

      - name: Test
        run: cargo test --locked

      - name: Package dry run
        run: cargo publish --dry-run --locked

  publish:
    name: Publish crate
    needs: [preflight, build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Authenticate to crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      - name: Publish crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../ccstats-${{ matrix.target }}.tar.gz ccstats
          cd ../../..
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 ccstats-${{ matrix.target }}.tar.gz > ccstats-${{ matrix.target }}.tar.gz.sha256
          else
            sha256sum ccstats-${{ matrix.target }}.tar.gz > ccstats-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../ccstats-${{ matrix.target }}.zip ccstats.exe
          cd ../../..
          (Get-FileHash ccstats-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() + "  ccstats-${{ matrix.target }}.zip" | Out-File -Encoding ascii ccstats-${{ matrix.target }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ccstats-${{ matrix.target }}
          path: ccstats-${{ matrix.target }}.*

  desktop:
    name: Desktop ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - target: x86_64-apple-darwin
            os: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            args: --bundles appimage
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            args: --bundles appimage
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            args: --bundles msi
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          prefix-key: desktop-${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Use ad-hoc macOS signature without Developer ID
        if: runner.os == 'macOS'
        run: |
          if [ -z "${APPLE_CERTIFICATE}" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE is unset; using ad-hoc signing so Apple Silicon DMGs are not marked damaged."
          fi

      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "WINDOWS_CERTIFICATE is unset; building an unsigned MSI."
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP "windows-cert"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $pfxPath = Join-Path $dir "certificate.pfx"
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE.Trim())
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $imported = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $secure)
          $cert = $imported | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          if (-not $cert) {
            $cert = $imported | Select-Object -First 1
          }
          $thumb = $cert.Thumbprint
          if (-not $thumb) {
            throw "Imported WINDOWS_CERTIFICATE but could not read a thumbprint."
          }
          $configPath = Join-Path $pwd "desktop/src-tauri/ci-windows-signing.json"
          $json = '{"bundle":{"windows":{"certificateThumbprint":"' + $thumb + '","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}}}'
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($configPath, $json, $utf8)
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_EXTRA_ARGS=--config src-tauri/ci-windows-signing.json"
          Write-Host "Imported Windows certificate $thumb"

      - name: Build desktop installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          includeUpdaterJson: false
          args: ${{ matrix.args }} ${{ env.TAURI_EXTRA_ARGS }}

      - name: Stage desktop artifacts
        shell: bash
        run: |
          python3 scripts/stage-desktop-artifacts.py \
            --search-root desktop/src-tauri/target \
            --output-dir staged-desktop \
            --target "${{ matrix.target }}"

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ccstats-desktop-${{ matrix.target }}
          path: staged-desktop/ccstats-desktop-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: [build, desktop, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true

  homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Extract release version
        id: release-version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for crates.io artifact
        run: >-
          curl --fail --show-error --silent
          --retry 12 --retry-all-errors --retry-delay 5
          "https://static.crates.io/crates/ccstats/ccstats-${{ steps.release-version.outputs.version }}.crate"
          --output /dev/null

      - name: Update Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: ccstats
          formula-path: Formula/ccstats.rb
          homebrew-tap: majiayu000/homebrew-tap
          tag-name: ${{ github.ref_name }}
          download-url: https://static.crates.io/crates/ccstats/ccstats-${{ steps.release-version.outputs.version }}.crate
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
