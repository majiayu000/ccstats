name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Validate release metadata
        run: scripts/check-release.sh

      - name: Stage-artifact helper self-test
        run: python3 scripts/stage-desktop-artifacts.py --self-test

      - name: Test
        run: cargo test --locked

      - name: Package dry run
        run: cargo publish --dry-run --locked

  publish:
    name: Publish crate
    needs: [preflight, build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Authenticate to crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      - name: Publish crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../ccstats-${{ matrix.target }}.tar.gz ccstats
          cd ../../..
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 ccstats-${{ matrix.target }}.tar.gz > ccstats-${{ matrix.target }}.tar.gz.sha256
          else
            sha256sum ccstats-${{ matrix.target }}.tar.gz > ccstats-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../ccstats-${{ matrix.target }}.zip ccstats.exe
          cd ../../..
          $checksum = (Get-FileHash ccstats-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() + "  ccstats-${{ matrix.target }}.zip`n"
          [IO.File]::WriteAllText((Join-Path $PWD "ccstats-${{ matrix.target }}.zip.sha256"), $checksum, [Text.Encoding]::ASCII)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ccstats-${{ matrix.target }}
          path: ccstats-${{ matrix.target }}.*

  desktop:
    name: Desktop ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - target: x86_64-apple-darwin
            os: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            args: --bundles appimage
            fuse_package: libfuse2
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            args: --bundles appimage
            fuse_package: libfuse2t64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            args: --bundles msi

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ${{ matrix.fuse_package }} xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          prefix-key: desktop-${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Linux installer
        if: runner.os == 'Linux'
        working-directory: desktop
        run: npm run tauri -- build ${{ matrix.args }}

      - name: Build macOS installer
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_KEY_CONTENT
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Apple signing secret: $name"
              exit 1
            fi
          done

          original_keychain="$(
            security default-keychain -d user \
              | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//'
          )"
          original_keychains=()
          while IFS= read -r existing_keychain; do
            if [ -n "$existing_keychain" ]; then
              original_keychains+=("$existing_keychain")
            fi
          done < <(
            security list-keychains -d user \
              | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//'
          )
          keychain_path="$RUNNER_TEMP/ccstats-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/ccstats-developer-id.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          keychain_password="$(openssl rand -hex 32)"

          cleanup_signing() {
            status=$?
            rm -f "$certificate_path" "$api_key_path"
            if [ -n "$original_keychain" ] \
              && ! security default-keychain -d user -s "$original_keychain"; then
              echo "::warning::Failed to restore the default macOS keychain"
            fi
            if ! security list-keychains -d user -s "${original_keychains[@]}"; then
              echo "::warning::Failed to restore the macOS keychain search list"
            fi
            if ! security delete-keychain "$keychain_path"; then
              echo "::warning::Failed to delete the temporary macOS signing keychain"
            fi
            return "$status"
          }
          trap cleanup_signing EXIT

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "${original_keychains[@]}"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          if ! security find-identity -v -p codesigning "$keychain_path" \
            | grep -F -- "$APPLE_SIGNING_IDENTITY" >/dev/null; then
            echo "::error::APPLE_SIGNING_IDENTITY was not found in the imported certificate"
            exit 1
          fi

          rm -f "$certificate_path"
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_CONTENT keychain_password
          export APPLE_API_KEY_PATH="$api_key_path"
          npm run tauri -- build ${{ matrix.args }}
          dmg_path="$(find src-tauri/target -type f -name '*.dmg' -print -quit)"
          if [ -z "$dmg_path" ]; then
            echo "::error::Signed macOS build did not produce a DMG."
            exit 1
          fi
          # Tauri notarizes and staples the .app. The DMG is signed but not
          # notarized, so stapler validate would fail with exit 65.
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          staple_ok=0
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler staple "$dmg_path"; then
              staple_ok=1
              break
            fi
            echo "stapler staple attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          if [ "$staple_ok" -ne 1 ]; then
            echo "::error::Failed to staple the notarization ticket onto the DMG."
            exit 1
          fi
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg_path"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          npm run tauri -- build ${{ matrix.args }}
          if ($LASTEXITCODE -ne 0) {
            throw "Tauri Windows build failed with exit code $LASTEXITCODE"
          }
          $installers = @(Get-ChildItem src-tauri/target -Recurse -Filter *.msi)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one unsigned Windows MSI, found $($installers.Count)."
          }

      - name: Stage desktop artifacts
        shell: bash
        run: |
          python3 scripts/stage-desktop-artifacts.py \
            --search-root desktop/src-tauri/target \
            --output-dir staged-desktop \
            --target "${{ matrix.target }}"

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ccstats-desktop-${{ matrix.target }}
          path: staged-desktop/ccstats-desktop-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: [build, desktop, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true

  homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Extract release version
        id: release-version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for crates.io artifact
        run: >-
          curl --fail --show-error --silent
          --retry 12 --retry-all-errors --retry-delay 5
          "https://static.crates.io/crates/ccstats/ccstats-${{ steps.release-version.outputs.version }}.crate"
          --output /dev/null

      - name: Update Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: ccstats
          formula-path: Formula/ccstats.rb
          homebrew-tap: majiayu000/homebrew-tap
          tag-name: ${{ github.ref_name }}
          download-url: https://static.crates.io/crates/ccstats/ccstats-${{ steps.release-version.outputs.version }}.crate
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
