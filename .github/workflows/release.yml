name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Validate release metadata
        run: scripts/check-release.sh

      - name: Stage-artifact helper self-test
        run: python3 scripts/stage-desktop-artifacts.py --self-test

      - name: Test
        run: cargo test --locked

      - name: Package dry run
        run: cargo publish --dry-run --locked

  publish:
    name: Publish crate
    needs: [preflight, build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Authenticate to crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      - name: Publish crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../ccstats-${{ matrix.target }}.tar.gz ccstats
          cd ../../..
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 ccstats-${{ matrix.target }}.tar.gz > ccstats-${{ matrix.target }}.tar.gz.sha256
          else
            sha256sum ccstats-${{ matrix.target }}.tar.gz > ccstats-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../ccstats-${{ matrix.target }}.zip ccstats.exe
          cd ../../..
          (Get-FileHash ccstats-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() + "  ccstats-${{ matrix.target }}.zip" | Out-File -Encoding ascii ccstats-${{ matrix.target }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ccstats-${{ matrix.target }}
          path: ccstats-${{ matrix.target }}.*

  desktop:
    name: Desktop ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - target: x86_64-apple-darwin
            os: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            args: --bundles appimage
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            args: --bundles appimage
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            args: --bundles msi

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          prefix-key: desktop-${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Stage desktop artifacts
        shell: bash
        run: |
          python3 scripts/stage-desktop-artifacts.py \
            --search-root desktop/src-tauri/target \
            --output-dir staged-desktop \
            --target "${{ matrix.target }}"

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ccstats-desktop-${{ matrix.target }}
          path: staged-desktop/ccstats-desktop-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: [build, desktop, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true

  homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Extract release version
        id: release-version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for crates.io artifact
        run: >-
          curl --fail --show-error --silent
          --retry 12 --retry-all-errors --retry-delay 5
          "https://static.crates.io/crates/ccstats/ccstats-${{ steps.release-version.outputs.version }}.crate"
          --output /dev/null

      - name: Update Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: ccstats
          formula-path: Formula/ccstats.rb
          homebrew-tap: majiayu000/homebrew-tap
          tag-name: ${{ github.ref_name }}
          download-url: https://static.crates.io/crates/ccstats/ccstats-${{ steps.release-version.outputs.version }}.crate
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
