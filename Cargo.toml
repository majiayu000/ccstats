[package]
name = "ccstats"
version = "0.5.2"
edition = "2024"
rust-version = "1.88"
description = "Fast, local-first token and cost analytics for AI coding agents"
license = "MIT"
repository = "https://github.com/majiayu000/ccstats"
homepage = "https://github.com/majiayu000/ccstats"
documentation = "https://docs.rs/ccstats"
readme = "README.md"
keywords = ["claude", "codex", "cursor", "token", "usage"]
categories = ["command-line-utilities"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ccstats-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "ccstats"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/ccstats-{ target }.zip"
pkg-fmt = "zip"
bin-dir = "ccstats.exe"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
glob = "0.3.3"
chrono = { version = "0.4.43", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.5.58", features = ["derive"] }
comfy-table = "7.2.2"
rayon = "1.11.0"
dirs = "6.0.0"
fs4 = "1.1.0"
ureq = { version = "3.2.0", features = ["json"] }
thiserror = "2"
toml = "1.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
jsonc-parser = { version = "0.33.1", features = ["serde"] }
json5 = "1.3.1"
zstd = "0.13.3"
base64 = "0.23.1"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
